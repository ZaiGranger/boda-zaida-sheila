services:
  - type: web
    name: boda-zaida-sheila
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Contraseña del panel admin (mesas / QR / galería completa)
      - key: ADMIN_PASSWORD
        value: yHpIqoQWqjGBk2wNX8kmkWvz2Pr2LHG6cgpiMuLoKYQ=
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_PLAYLIST_URL
        sync: false
      - key: SPOTIFY_COLLABORATOR_URL
        sync: false
      - key: SPOTIFY_PLAYLIST_TITLE
        sync: false
